name: Test Discord Failure

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Fake error
        run: exit 1

      - name: Run local Discord Failure Notifier
        if: failure()
        uses: ./
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
